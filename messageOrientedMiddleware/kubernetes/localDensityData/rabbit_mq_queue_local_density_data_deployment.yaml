# Source: https://www.rabbitmq.com/kubernetes/operator/using-topology-operator#queues-policies
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: rabbit-mq-queue-local-density-data
spec:
  name: rabbit-mq-queue-local-density-data
  # Classic queue; the maximum queue length is set centrally by the policy in
  # kubernetes/rabbit_mq_policy_max_length_deployment.yaml
  type: classic
  durable: true
  autoDelete: false
  rabbitmqClusterReference:
    name: rabbit-mq-cluster