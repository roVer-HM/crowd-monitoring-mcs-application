# Builds the MCS server and the simulated mobile sensing client for linux/amd64 and linux/arm64
# and pushes them to ghcr.io/rover-hm/<image>.
#
# Images:
#   ghcr.io/rover-hm/crowd-monitoring-server
#   ghcr.io/rover-hm/simulated_mobile_sensing_client
# Tags:
#   push to main          -> :main, :sha-<short>
#   Git tag v1.2.3        -> :1.2.3, :1.2, :latest
#   manual run            -> :<branch>, :sha-<short>
name: container-images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crowdDensityLibrary/**"
      - "server/**"
      - "simulatedMobileSensingClients/**"
      - ".github/workflows/container-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: crowd-monitoring-server
            dockerfile: server/Dockerfile.multiarch
          - name: simulated_mobile_sensing_client
            dockerfile: simulatedMobileSensingClients/Dockerfile.multiarch
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr image names must be lowercase (owner roVer-HM -> rover-hm)
          images: ghcr.io/rover-hm/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
