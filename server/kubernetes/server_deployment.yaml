# Source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowd-monitoring-server-deployment
spec:
  selector:
    matchLabels:
      app: crowd-monitoring-server
  # Three instances of the crowd monitoring server will be deployed
  replicas: 3
  template:
    metadata:
      labels:
        app: crowd-monitoring-server
    spec:
      containers:
        - image: ghcr.io/rover-hm/crowd-monitoring-server:0.6.0
          name: crowd-monitoring-server
          # Define connection parameters to the RabbitMQ cluster as environment variables for the container
          # These are used within the containerized Spring Boot application to connect to the RabbitMQ cluster deployed to Kubernetes
          # Source: https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/
          env:
            - name: RABBIT_MQ_HOST
              value: ""
            - name: RABBIT_MQ_PORT
              value: ""
            - name: RABBIT_MQ_USERNAME
              value: ""
            - name: RABBIT_MQ_PASSWORD
              value: ""
            # Interval for publishing the global density data in ms (default 5000, as in the thesis)
            - name: GLOBAL_PUBLISH_INTERVAL_MS
              value: "5000"
            # Which servers publish the global density data to the clients: leader (default) = only one server,
            # elected via an exclusive queue in RabbitMQ, the others only synchronise with each other via
            # rabbit-mq-exchange-server-sync; all = every server (behaviour of the thesis)
            - name: GLOBAL_PUBLISHER_MODE
              value: "leader"
