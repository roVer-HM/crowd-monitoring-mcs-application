spring.application.name=Server

# Do not start web server, as this is not needed for the crowd monitoring system
# Source: https://docs.spring.io/spring-boot/how-to/webserver.html
spring.main.web-application-type=NONE

# Specify connection parameters for RabbitMQ
# These are taken from the environment variables of the docker container, the server is executed in
# Source: https://docs.spring.io/spring-boot/reference/messaging/amqp.html
spring.rabbitmq.host=${RABBIT_MQ_HOST}
spring.rabbitmq.port=${RABBIT_MQ_PORT}
spring.rabbitmq.username=${RABBIT_MQ_USERNAME}
spring.rabbitmq.password=${RABBIT_MQ_PASSWORD}

# Fetch only one message at a time from the queue, so that unprocessed messages remain in the queue
# and are covered by the maximum queue length (policy rabbit-mq-policy-max-length, 100 messages).
# Source: https://docs.spring.io/spring-boot/appendix/application-properties/index.html#application-properties.integration.spring.rabbitmq.listener.simple.prefetch
spring.rabbitmq.listener.simple.prefetch=1
